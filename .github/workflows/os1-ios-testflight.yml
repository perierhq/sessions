# Tella's client release pipeline — fork and rebrand (see packages/clients/ios/README).
name: Release OS1 for iOS (TestFlight)

# Builds, signs and uploads the native SwiftUI OS1 iOS client to TestFlight
# whenever iOS code lands on main. Signing mirrors the manual path that works
# for this team: cloud-managed *distribution* signing is forbidden for our App
# Store Connect key's role, so we import a stored Apple Distribution cert,
# fetch the current profiles from App Store Connect, and sign manually
# (development/automatic signing is NOT used here).

on:
  push:
    branches: [main]
    paths:
      # Build inputs only — docs (AGENTS.md/CLAUDE.md/README.md) land in
      # packages/clients/ios/ constantly and must not each ship a TestFlight build.
      - "packages/clients/ios/**"
      - "!packages/clients/ios/**.md"
      - ".github/workflows/os1-ios-testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os1-ios-testflight-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/clients/ios

jobs:
  build:
    if: vars.IOS_RELEASE_ENABLED == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      OS1_DERIVED_DATA: ${{ github.workspace }}/.xcode-derived-data/ios
      OS1_COMPILATION_CACHE: ${{ github.workspace }}/.xcode-compilation-cache/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fingerprint build tools
        id: build-tools
        run: |
          FINGERPRINT=$(
            { xcodebuild -version; xcodegen --version; } |
              shasum -a 256 | cut -d ' ' -f 1
          )
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Restore Swift packages
        id: package-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.OS1_DERIVED_DATA }}/SourcePackages
          key: os1-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/clients/ios/project.yml') }}
          restore-keys: |
            os1-packages-v1-${{ runner.os }}-${{ runner.arch }}-

      # Xcode archives rebuild their DerivedData intermediates. Xcode 26's CAS
      # is specifically designed to reuse compiler outputs across clean builds.
      - name: Restore Xcode compilation cache
        id: compilation-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.OS1_COMPILATION_CACHE }}
          key: os1-cas-v1-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-tools.outputs.fingerprint }}-${{ hashFiles('packages/clients/ios/project.yml') }}-${{ github.sha }}
          restore-keys: |
            os1-cas-v1-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-tools.outputs.fingerprint }}-${{ hashFiles('packages/clients/ios/project.yml') }}-
            os1-cas-v1-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-tools.outputs.fingerprint }}-

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.OS1_IOS_DIST_P12_BASE64 }}
          p12-password: ${{ secrets.OS1_IOS_DIST_P12_PASSWORD }}

      - name: Install App Store provisioning profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          ASC_PRIVATE_KEY=$(printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 -D)
          export ASC_PRIVATE_KEY
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          node ci/fetch-provisioning-profile.mjs \
            "OS1 App Store Push" "$PROFILES/OS1_App_Store_Push.mobileprovision"
          # Sanity: it must be the app profile and authorize production APNs.
          security cms -D -i "$PROFILES/OS1_App_Store_Push.mobileprovision" > /tmp/os1-ios-profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/os1-ios-profile.plist | grep -q 'dev.tella.os1'
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' /tmp/os1-ios-profile.plist)" = production

      # The widget extension is a second bundle id (dev.tella.os1.widgets), so
      # the app's profile cannot sign it. This one is fetched from App Store
      # Connect with the API key the upload job already uses, rather than
      # carried as another secret — one less thing to rotate by hand.
      - name: Install widget extension provisioning profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          ASC_PRIVATE_KEY=$(printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 -D)
          export ASC_PRIVATE_KEY
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          node ci/fetch-provisioning-profile.mjs \
            "OS1 Widgets App Store" "$PROFILES/OS1_Widgets_App_Store.mobileprovision"
          security cms -D -i "$PROFILES/OS1_Widgets_App_Store.mobileprovision" > /tmp/os1-widgets-profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/os1-widgets-profile.plist | grep -q 'dev.tella.os1.widgets'

      - name: Compute build number
        id: build
        run: |
          # Builds 1 and 2 were uploaded manually before this pipeline existed;
          # offset by 2 so CI build numbers stay strictly increasing.
          BN=$(( 2 + GITHUB_RUN_NUMBER ))
          echo "number=$BN" >> "$GITHUB_OUTPUT"
          echo "iOS build number: $BN"

      # The repository ships a portable default (localhost) so a fresh clone does
      # not point at someone else's server. Release builds stamp the real one in.
      # Set the OS1_SERVER_URL repository variable to override.
      - name: Stamp deployment server
        env:
          SERVER: ${{ vars.OS1_SERVER_URL || 'https://os.tella.dev' }}
        run: |
          grep -q 'INFOPLIST_KEY_OS1DefaultServerURL:' project.yml \
            || { echo '::error::OS1DefaultServerURL key missing from project.yml'; exit 1; }
          sed -i '' "s|INFOPLIST_KEY_OS1DefaultServerURL: .*|INFOPLIST_KEY_OS1DefaultServerURL: $SERVER|" project.yml
          grep 'INFOPLIST_KEY_OS1DefaultServerURL' project.yml

      - name: Generate Xcode project
        run: |
          echo "Compilation cache restored: ${{ steps.compilation-cache.outputs.cache-matched-key || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          xcodegen generate

      - name: Run unit tests on macOS
        run: |
          xcodebuild test \
            -skipMacroValidation \
            -project OS1.xcodeproj \
            -scheme OS1Mac \
            -destination 'platform=macOS' \
            -derivedDataPath "$OS1_DERIVED_DATA" \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            SWIFT_ENABLE_COMPILE_CACHE=YES \
            COMPILATION_CACHE_CAS_PATH="$OS1_COMPILATION_CACHE" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        run: |
          xcodebuild archive \
            -skipMacroValidation \
            -project OS1.xcodeproj \
            -scheme OS1 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$OS1_DERIVED_DATA" \
            -archivePath "$RUNNER_TEMP/OS1.xcarchive" \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            SWIFT_ENABLE_COMPILE_CACHE=YES \
            COMPILATION_CACHE_CAS_PATH="$OS1_COMPILATION_CACHE" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CURRENT_PROJECT_VERSION=${{ steps.build.outputs.number }}
          # Manual signing (style/identity/profile) lives in project.yml's
          # Release config, scoped to the app target: command-line settings
          # apply to every target, and SwiftPM package targets reject
          # provisioning profiles, failing the archive.

      - name: Export signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>6GUXT43C8B</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution: Tella HQ Inc. (6GUXT43C8B)</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.tella.os1</key><string>OS1 App Store Push</string>
              <key>dev.tella.os1.widgets</key><string>OS1 Widgets App Store</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OS1.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Save Swift packages
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.OS1_DERIVED_DATA }}/SourcePackages
          key: os1-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/clients/ios/project.yml') }}

      - name: Save Xcode compilation cache
        if: steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.OS1_COMPILATION_CACHE }}
          key: os1-cas-v1-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-tools.outputs.fingerprint }}-${{ hashFiles('packages/clients/ios/project.yml') }}-${{ github.sha }}

      - name: Store signed IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: os1-ios-${{ github.run_id }}
          path: ${{ runner.temp }}/export/OS1.ipa
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  testflight:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download signed IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: os1-ios-${{ github.run_id }}
          path: dist

      - name: Decode App Store Connect API key
        id: app-store-key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          KEY=$(printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d)
          test -n "$KEY"
          MASKED=${KEY//'%'/'%25'}
          MASKED=${MASKED//$'\r'/'%0D'}
          MASKED=${MASKED//$'\n'/'%0A'}
          echo "::add-mask::$MASKED"
          {
            echo 'private-key<<__ASC_PRIVATE_KEY__'
            printf '%s\n' "$KEY"
            echo '__ASC_PRIVATE_KEY__'
          } >> "$GITHUB_OUTPUT"

      # The App Store API backend supports IPA uploads on Linux. Do not wait
      # for Apple's asynchronous processing on an Actions runner.
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@1ad58030672057aa084b4e96beb6f7a8c627f9e6 # v5.2.1
        with:
          app-path: dist/OS1.ipa
          app-type: ios
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ steps.app-store-key.outputs.private-key }}
          backend: appstore-api
          wait-for-processing: "false"

  cooldown:
    needs: testflight
    if: ${{ !cancelled() && github.event_name == 'push' && vars.IOS_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hold automatic release cooldown
        working-directory: .
        run: sleep 900
