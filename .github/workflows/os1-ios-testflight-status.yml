name: OS1 iOS TestFlight status

# Read-only: asks App Store Connect what happened to the latest uploads.
# The release workflow does not wait for Apple's processing, so a build Apple
# later marks invalid never turns that run red. Run this to see the verdict.
# Gated like the release itself: it skips until IOS_RELEASE_ENABLED is true,
# and reads the app's bundle id from packages/clients/ios/project.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    if: vars.IOS_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          sparse-checkout: packages/clients/ios
      - name: Query App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          ASC_PRIVATE_KEY=$(printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 -d)
          export ASC_PRIVATE_KEY
          node packages/clients/ios/ci/testflight-status.mjs "" 8
