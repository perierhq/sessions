# Inherited from upstream Open Session. Nothing here names an Apple account:
# the bundle id and profile name come from packages/clients/ios/project.yml,
# the team and server from repository variables. AGENTS.md "Release
# workflows" lists what to set before MAC_RELEASE_ENABLED.
name: Release OS1 for macOS (TestFlight)

# Builds, signs and uploads the native SwiftUI OS1 client's macOS target
# (OS1Mac in packages/clients/ios/project.yml) to TestFlight whenever os1-ios code lands on
# main — the sibling of os1-ios-testflight.yml, sharing the same app record
# (OS1Mac's bundle id is the iOS app's, universal purchase) and the same
# Apple Distribution cert.
#
# The Mac wrinkle: the App Store .pkg must be signed by a Mac Installer
# Distribution identity, and both identities share ONE private key — a second
# p12 import into an existing keychain silently skips the key's ACL, which
# makes productbuild fail with a bare "Error signing data" (bit us on the
# build box, 2026-07-24). So the keychain is built by hand with `-A` imports
# instead of the import-codesign-certs action.
#
# Unit tests are not repeated here: the iOS workflow runs the (pure-logic)
# suite on every push touching the same paths.

on:
  push:
    branches: [main]
    paths:
      # Build inputs only — docs (AGENTS.md/CLAUDE.md/README.md) land in
      # packages/clients/ios/ constantly and must not each ship a TestFlight build.
      - "packages/clients/ios/**"
      - "!packages/clients/ios/**.md"
      - ".github/workflows/os1-mac-testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os1-mac-testflight-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/clients/ios

jobs:
  testflight:
    if: vars.MAC_RELEASE_ENABLED == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # Also read by `xcodegen generate`: project.yml's DEVELOPMENT_TEAM is
      # ${APPLE_TEAM_ID}.
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      OS1_SERVER_URL: ${{ vars.OS1_SERVER_URL }}
      OS1_DERIVED_DATA: ${{ github.workspace }}/.xcode-derived-data/macos
      OS1_COMPILATION_CACHE: ${{ github.workspace }}/.xcode-compilation-cache/macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # Fails before any signing work when a repository variable is missing,
      # and reads the bundle id and profile name from project.yml once.
      - name: Read signing identities
        id: ids
        run: |
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] \
            || { echo '::error::Set the APPLE_TEAM_ID repository variable to your 10-character Apple team id'; exit 1; }
          [[ "$OS1_SERVER_URL" =~ ^https?://[^[:space:]|]+$ ]] \
            || { echo '::error::Set the OS1_SERVER_URL repository variable to the server the app opens by default (https://...)'; exit 1; }
          APP_ID=$(node ci/project-settings.mjs OS1Mac PRODUCT_BUNDLE_IDENTIFIER)
          APP_PROFILE=$(node ci/project-settings.mjs OS1Mac PROVISIONING_PROFILE_SPECIFIER Release)
          {
            echo "app-id=$APP_ID"
            echo "app-profile=$APP_PROFILE"
          } >> "$GITHUB_OUTPUT"
          echo "Team $APPLE_TEAM_ID: $APP_ID ($APP_PROFILE)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fingerprint build tools
        id: build-tools
        run: |
          FINGERPRINT=$(
            { xcodebuild -version; xcodegen --version; } |
              shasum -a 256 | cut -d ' ' -f 1
          )
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Restore Swift packages
        id: package-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.OS1_DERIVED_DATA }}/SourcePackages
          key: os1-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/clients/ios/project.yml') }}
          restore-keys: |
            os1-packages-v1-${{ runner.os }}-${{ runner.arch }}-

      # The universal archive recompiles every dependency for arm64 and x86_64.
      # Xcode 26's CAS reuses those compiler outputs across clean archives.
      - name: Restore Xcode compilation cache
        id: compilation-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.OS1_COMPILATION_CACHE }}
          key: os1-cas-v1-macos-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-tools.outputs.fingerprint }}-${{ hashFiles('packages/clients/ios/project.yml') }}-${{ github.sha }}
          restore-keys: |
            os1-cas-v1-macos-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-tools.outputs.fingerprint }}-${{ hashFiles('packages/clients/ios/project.yml') }}-
            os1-cas-v1-macos-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-tools.outputs.fingerprint }}-

      - name: Build signing keychain (both identities, -A key access)
        env:
          DIST_P12_BASE64: ${{ secrets.OS1_IOS_DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.OS1_IOS_DIST_P12_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.OS1_MAC_INSTALLER_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.OS1_MAC_INSTALLER_P12_PASSWORD }}
        run: |
          test -n "$DIST_P12_BASE64" && test -n "$INSTALLER_P12_BASE64"
          KC="$RUNNER_TEMP/os1-mac.keychain-db"
          KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$DIST_P12_BASE64" | base64 -D > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$INSTALLER_P12_BASE64" | base64 -D > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -A
          security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$INSTALLER_P12_PASSWORD" -A
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/installer.p12"
          # WWDR G3 intermediate — without it both identities report invalid.
          # Tolerate "already exists": GitHub runners ship it pre-installed.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdrg3.cer"
          security import "$RUNNER_TEMP/wwdrg3.cer" -k "$KC" || true
          security set-key-partition-list -S "apple-tool:,apple:" -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          security find-identity -v "$KC"
          # Both identities must belong to APPLE_TEAM_ID; the export step
          # picks them by type, not by holder name.
          security find-identity -v "$KC" | grep -q "\"Apple Distribution: .* ($APPLE_TEAM_ID)\"" \
            || { echo "::error::No Apple Distribution identity for team $APPLE_TEAM_ID in OS1_IOS_DIST_P12_BASE64"; exit 1; }
          security find-identity -v "$KC" | grep -Eq "\"(3rd Party Mac Developer Installer|Mac Installer Distribution): .* \($APPLE_TEAM_ID\)\"" \
            || { echo "::error::No Mac installer identity for team $APPLE_TEAM_ID in OS1_MAC_INSTALLER_P12_BASE64"; exit 1; }
          echo "OS1_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Install Mac App Store provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.OS1_MAC_PROVISIONING_PROFILE_BASE64 }}
          APP_ID: ${{ steps.ids.outputs.app-id }}
          APP_PROFILE: ${{ steps.ids.outputs.app-profile }}
        run: |
          test -n "$PROFILE_BASE64"
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$PROFILES/OS1_Mac_App_Store.provisionprofile"
          # Sanity: it must be the Mac App Store profile project.yml names,
          # for our team and bundle id.
          security cms -D -i "$PROFILES/OS1_Mac_App_Store.provisionprofile" > /tmp/os1-mac-profile.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/os1-mac-profile.plist)" = "$APP_PROFILE" \
            || { echo "::error::OS1_MAC_PROVISIONING_PROFILE_BASE64 is not the profile named \"$APP_PROFILE\" in project.yml"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' /tmp/os1-mac-profile.plist)" = "$APPLE_TEAM_ID.$APP_ID" \
            || { echo "::error::Profile \"$APP_PROFILE\" is not for $APPLE_TEAM_ID.$APP_ID"; exit 1; }

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_P8_BASE64"
          KEYS="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEYS"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -D > "$KEYS/AuthKey_${ASC_KEY_ID}.p8"

      - name: Compute build number
        id: build
        run: |
          # Upstream uploaded macOS build 3 by hand before this pipeline
          # existed. The offset is harmless on a new app record: build numbers
          # only have to keep increasing.
          BN=$(( 3 + GITHUB_RUN_NUMBER ))
          echo "number=$BN" >> "$GITHUB_OUTPUT"
          echo "macOS build number: $BN"

      # The repository ships a portable default (localhost) so a fresh clone does
      # not point at someone else's server. Release builds stamp the
      # OS1_SERVER_URL repository variable in.
      - name: Stamp deployment server
        run: |
          SERVER="${OS1_SERVER_URL%/}"
          grep -q 'INFOPLIST_KEY_OS1DefaultServerURL:' project.yml \
            || { echo '::error::OS1DefaultServerURL key missing from project.yml'; exit 1; }
          sed -i '' "s|OS1DefaultServerURL: .*|OS1DefaultServerURL: $SERVER|" project.yml
          grep 'OS1DefaultServerURL' project.yml

      - name: Generate Xcode project
        run: |
          echo "Compilation cache restored: ${{ steps.compilation-cache.outputs.cache-matched-key || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          xcodegen generate
          grep -q "DEVELOPMENT_TEAM = $APPLE_TEAM_ID;" OS1.xcodeproj/project.pbxproj \
            || { echo '::error::xcodegen did not apply APPLE_TEAM_ID'; exit 1; }

      - name: Archive
        run: |
          xcodebuild archive \
            -skipMacroValidation \
            -project OS1.xcodeproj \
            -scheme OS1Mac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$OS1_DERIVED_DATA" \
            -archivePath "$RUNNER_TEMP/OS1Mac.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $OS1_KEYCHAIN" \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            SWIFT_ENABLE_COMPILE_CACHE=YES \
            COMPILATION_CACHE_CAS_PATH="$OS1_COMPILATION_CACHE" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CURRENT_PROJECT_VERSION=${{ steps.build.outputs.number }}
          # Manual signing (style/identity/profile) lives in project.yml's
          # Release config, scoped to the app target: command-line settings
          # apply to every target, and SwiftPM package targets reject
          # provisioning profiles, failing the archive. The keychain flag
          # stays here — it's runner-specific and profile-free, so package
          # targets don't object to it.

      # "Apple Distribution" and "Mac Installer Distribution" are Xcode's
      # automatic selectors: the newest certificate of that type for teamID
      # in the keychain, so no holder name has to be spelled out here.
      - name: Export signed pkg
        env:
          APP_ID: ${{ steps.ids.outputs.app-id }}
          APP_PROFILE: ${{ steps.ids.outputs.app-profile }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>Mac Installer Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_ID</key><string>$APP_PROFILE</string>
            </dict>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OS1Mac.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Save Swift packages
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.OS1_DERIVED_DATA }}/SourcePackages
          key: os1-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/clients/ios/project.yml') }}

      - name: Save Xcode compilation cache
        if: steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.OS1_COMPILATION_CACHE }}
          key: os1-cas-v1-macos-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-tools.outputs.fingerprint }}-${{ hashFiles('packages/clients/ios/project.yml') }}-${{ github.sha }}

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Named from OS1Mac's PRODUCT_NAME ("OS.pkg"), so glob for
          # it: a rename should not be able to break the upload silently.
          shopt -s nullglob
          PKGS=("$RUNNER_TEMP"/export/*.pkg)
          test ${#PKGS[@]} -eq 1 || { echo "::error::expected exactly one exported .pkg, found ${#PKGS[@]}"; exit 1; }
          xcrun altool --upload-app -f "${PKGS[0]}" -t macos \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

  cooldown:
    needs: testflight
    if: ${{ !cancelled() && github.event_name == 'push' && vars.MAC_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hold automatic release cooldown
        working-directory: .
        run: sleep 900
